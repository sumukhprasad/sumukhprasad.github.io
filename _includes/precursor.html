{% if jekyll.environment == "development" %}
	<div class="page-precursor">
		Running in development!
	</div>
{% endif %}

<script>
	if (!window.location.host.includes("https://sumukhprasad.com") && !window.location.host.includes("localhost")) {
		var precursor = document.createElement("div");
		precursor.classList.add("page-precursor");
		
		precursor.innerHTML = "This site wasn't served from my server.<br>Informaition may be out of date. Please visit <a href=\"https://sumukhprasad.com\">sumukhprasad.com</a> instead.";
		
		document.body.insertBefore(precursor, document.body.childNodes[0]);
	}
</script>
