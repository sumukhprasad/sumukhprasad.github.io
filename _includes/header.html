<script>
	function convertToCollapsable(s) {
		document.getElementById(s+"-b").onclick = function () {
			if (document.getElementById(s+"-b").innerText=="[expand]") {
				document.getElementById(s).classList.remove("collapsed");
				document.getElementById(s+"-b").innerText="[collapse]";
			} else {
				document.getElementById(s).classList.add("collapsed");
				document.getElementById(s+"-b").innerText="[expand]";
			}
		}
	}
</script>
